<!doctype html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- The console has one light palette and no dark variant, so native
             controls (checkboxes, date pickers, scrollbars) must render light
             even when the operating system is in dark mode. -->
        <meta name="color-scheme" content="light" />
        <meta
            name="description"
            content="Trifolium admin console — orders, lab, deliveries, customers, finance and inventory for a compounding pharmacy."
        />
        <!-- Replaced on the first navigation with "ניהול | <screen>"; this is
             only what shows while the bundle is still loading. -->
        <title>ניהול</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/resources/js/app.js"></script>
    </body>
</html>
